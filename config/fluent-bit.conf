[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  Off
    HTTP_Listen  127.0.0.1
    HTTP_Port    2020
    storage.path              /fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 50M
    storage.max_chunks_up     128

# ──────────────────────────────────────────────
# INPUTS — tail Docker json-file logs
# Tag embeds 64-char container id for Lua enrich
# ──────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               docker.<container_id>
    Tag_Regex         .*containers/(?<container_id>[0-9a-f]{64})/.*-json\.log$
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/storage/flb_docker.db
    Read_from_Head    Off
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

# Host journal (kernel + systemd). Filtered in Lua — do not ingest full syslog.
[INPUT]
    Name              systemd
    Tag               host.journal
    Path              /var/log/journal
    Read_From_Tail    On
    Strip_Underscores On
    DB                /fluent-bit/storage/flb_journal.db
    Mem_Buf_Limit     5MB
    storage.type      filesystem

# ──────────────────────────────────────────────
# FILTERS — container_name from config.v2.json
# ──────────────────────────────────────────────
[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/container_enrich.lua
    call    enrich

[FILTER]
    Name    lua
    Match   host.*
    script  /fluent-bit/etc/container_enrich.lua
    call    keep_host

[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  host ${HOSTNAME}

[FILTER]
    Name    record_modifier
    Match   host.*
    Record  host ${HOSTNAME}
    Record  container_name host-journal

# ──────────────────────────────────────────────
# OUTPUT — PostgreSQL (log DB only, never the app DB)
# ──────────────────────────────────────────────
[OUTPUT]
    Name          pgsql
    Match         *
    Host          ${POSTGRES_HOST}
    Port          ${POSTGRES_PORT}
    User          ${POSTGRES_USER}
    Password      ${POSTGRES_PASSWORD}
    Database      ${POSTGRES_DB}
    Table         container_logs
    Timestamp_Key time
    Async         false
    Retry_Limit   False
